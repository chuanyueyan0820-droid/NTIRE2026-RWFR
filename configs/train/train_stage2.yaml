model:
  cldm:
    target: diffbir.model.cldm.ControlLDM
    params:
      latent_scale_factor: 0.18215
      unet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64 
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: "penultimate"
      controlnet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        hint_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64 
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False

  swinir:
    target: diffbir.model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: "nearest+conv"
      resi_connection: "1conv"
      unshuffle: True
      unshuffle_scale: 8

  diffusion:
    target: diffbir.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000
      zero_snr: False
      parameterization: eps

dataset:
  train:
    target: diffbir.dataset.codeformer.CodeformerDataset
    params:
      file_list: /media/witai513/64e0bfd6-4b93-4dd5-9d71-9a1891ecba0d/data/ycy/ffhq/ffhq512/train_hr.list
      file_backend_cfg:
        target: diffbir.dataset.file_backend.HardDiskBackend
      out_size: 512
      crop_type: center
      blur_kernel_size: 41
      kernel_list: ['iso', 'aniso']
      kernel_prob: [0.5, 0.5]
      # --- 改进：强化退化参数 ---
      blur_sigma: [0.2, 15.0]        # 应对 NTIRE 极度模糊
      downsample_range: [1.0, 16.0]  # 增强对低清图的兼容力
      noise_range: [0, 30]           # 增强抗噪能力
      jpeg_range: [10, 100]          # 应对严重的压缩损失

batch_transform:
  target: diffbir.dataset.batch_transform.IdentityBatchTransform

train:
  sd_path: /media/witai513/64e0bfd6-4b93-4dd5-9d71-9a1891ecba0d/data/ycy/DiffBIR-main/weights/v2-1_512-ema-pruned.ckpt
  exp_dir: /media/witai513/64e0bfd6-4b93-4dd5-9d71-9a1891ecba0d/data/ycy/DiffBIR-main/experiments/stage2_ffhq512_NEW
  swinir_path: /media/witai513/64e0bfd6-4b93-4dd5-9d71-9a1891ecba0d/data/ycy/DiffBIR-main/experiments/stage1_ffhq512/checkpoints/0010000.pt
  learning_rate: 2e-5
  # --- 改进：训练强度配置 ---
  batch_size: 4                 # 4090D 单卡跑 4 比较平衡
  num_workers: 4
  train_steps: 140000          # 彻底消除马赛克所需的步数
  log_every: 100
  ckpt_every: 5000              # 每 5000 步存个档
  image_every: 500              # 每 500 步看一眼效果
  resume: /media/witai513/64e0bfd6-4b93-4dd5-9d71-9a1891ecba0d/data/ycy/DiffBIR-main/experiments/stage2_ffhq512_NEW/checkpoints/0110000.pt
  noise_aug_timestep: 0